<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <!-- Relacionando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="Fundo">
      <div id="VisorAntigo"></div>
     
      <div id="VisorAtual"></div>
     
      <div id="Linha01">
        <div class="Botao" id="btn7"> 7 </div>
        <div class="Botao" id="btn8"> 8 </div>
        <div class="Botao" id="btn9"> 9 </div>
        <div class="Botao" id="btnDiv"> / </div>
      </div>
       
      <div id="Linha02">
        <div class="Botao" id="btn4"> 4 </div>
        <div class="Botao" id="btn5"> 5 </div>
        <div class="Botao" id="btn6"> 6 </div>
        <div class="Botao" id="btnMult"> * </div>
      </div>
       
      <div id="Linha03">
        <div class="Botao" id="btn1"> 1 </div>
        <div class="Botao" id="btn2"> 2 </div>
        <div class="Botao" id="btn3"> 3 </div>
        <div class="Botao" id="btnSub"> - </div>
      </div>
       
      <div id="Linha04">
        <div class="Botao" id="btnLimpa"> C </div>
        <div class="Botao" id="btn0"> 0 </div>
        <div class="Botao" id="btnCalc"> = </div>
        <div class="Botao" id="btnMais"> + </div>
      </div>
       
    </div>

    <!-- Relacionando o arquivo JavaScript -->
    <script src="javascript.js"></script>
  </body>
</html>
